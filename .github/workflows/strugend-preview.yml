name: Strugend desktop preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Confirmed preview version (must match package.json)
        required: true
        type: string
      publish:
        description: Publish a GitHub prerelease after every native build passes
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: strugend-preview-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            runner: windows-2022
          - target: mac-arm64
            runner: macos-15
          - target: mac-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      DSH_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      PREVIEW_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .artifacts/laya-model
          key: laya-multilingual-${{ hashFiles('apps/desktop-host/src/laya-manifest.json') }}
      - run: pnpm install --frozen-lockfile
      - name: Check native CPU inference bindings
        run: >-
          pnpm --dir apps/desktop-host exec node -e "require(process.platform === 'darwin' && process.arch === 'x64' ? 'onnxruntime-node-intel-mac' : 'onnxruntime-node'); console.log(process.platform, process.arch, 'CPU runtime available')"
      - name: Validate preview and native build host
        run: pnpm strugend:package ${{ matrix.target }} --version "$env:PREVIEW_VERSION" --check
        shell: pwsh
      - name: Run packaging and platform regression tests
        run: >-
          pnpm exec vitest run apps/desktop/tests/strugend-preview.spec.ts
          apps/desktop/tests/agentos-media-executable.spec.ts
          apps/desktop/tests/package-target.spec.ts
          apps/desktop/tests/package-target-stages.spec.ts
          apps/desktop/tests/desktop-package-environment.spec.ts
          apps/desktop/tests/agentos-address.spec.ts
          apps/desktop/tests/agentos-navigation.spec.ts
          apps/desktop/tests/agentos-browser.spec.ts
          apps/desktop/tests/agentos-browser-target.spec.ts
          apps/desktop/tests/main-startup.spec.ts
          apps/desktop/tests/smoke-desktop-bridge.spec.ts
          apps/desktop/tests/strugend-location.spec.ts
          apps/desktop-host/tests/strugend-services.spec.ts
          apps/desktop-host/tests/strugend-intelligence.spec.ts
          apps/desktop-host/tests/strugend-intelligence-loop.spec.ts
          apps/desktop-host/tests/strugend-decision.spec.ts
          apps/desktop-host/tests/strugend-delivery.spec.ts
          apps/desktop-host/tests/strugend-laya-local.spec.ts
          apps/desktop-host/tests/strugend-persistence.spec.ts
          apps/desktop-host/tests/strugend-advisor.spec.ts
          apps/desktop-host/tests/optional-components.spec.ts
          apps/desktop-host/tests/primary-runtime.spec.ts
          apps/desktop/tests/runtime-file-policy.spec.ts
          --maxWorkers=2 --testTimeout=90000 --hookTimeout=90000
      - name: Exercise Windows installer choices and animated installation
        if: matrix.target == 'win-x64'
        run: pnpm --dir apps/desktop run test:installer
      - name: Verify native terminal startup and prompt detection
        run: pnpm exec vitest run packages/terminal/terminal-bash/tests --maxWorkers=2 --testTimeout=90000 --hookTimeout=90000
      - name: Build native installer and run bundled runtime smokes
        run: pnpm strugend:package ${{ matrix.target }} --version "$env:PREVIEW_VERSION"
        shell: pwsh
      - name: Verify optional archives through the download manager
        env:
          STRUGEND_COMPONENT_TEST: '1'
          LAYA_PACKAGED_ROOT: apps/desktop/.desktop-build/targets/${{ matrix.target }}
        run: pnpm exec vitest run apps/desktop-host/tests/optional-components.built.spec.ts --maxWorkers=1 --testTimeout=600000 --hookTimeout=120000
      - name: Measure real native inference and memory release
        env:
          LAYA_MODEL_TEST: '1'
          LAYA_PACKAGED_ROOT: apps/desktop/.desktop-build/targets/${{ matrix.target }}
        run: pnpm exec vitest run apps/desktop-host/tests/strugend-laya.built.spec.ts --maxWorkers=1
      - name: Exercise packaged chat, local Laya, delivery, credentials and browser
        shell: pwsh
        run: |
          $output = (Resolve-Path "apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts").Path
          if ($IsWindows) {
            $installer = Get-ChildItem $output -File -Filter '*.exe' | Select-Object -First 1
            if (-not $installer) { throw 'The Windows installer is missing' }
            $installRoot = Join-Path $env:RUNNER_TEMP 'Strugend-Preview'
            $installed = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
            if ($installed.ExitCode -ne 0) { throw "Installer failed: $($installed.ExitCode)" }
            $app = Join-Path $installRoot 'Strugend Harness.exe'
            if (-not (Test-Path $app)) { throw 'The installer did not create the application' }
          }
          else {
            $bundle = Get-ChildItem $output -Directory -Recurse -Filter 'Strugend Harness.app' | Select-Object -First 1
            if (-not $bundle) { throw 'Packaged application bundle is missing' }
            $app = Join-Path $bundle.FullName 'Contents/MacOS/Strugend Harness'
          }
          node apps/web/tests/strugend-desktop-smoke.mjs "$app"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strugend-evidence-${{ matrix.target }}
          path: |
            .artifacts/strugend/packaged-*
            .artifacts/strugend/local-laya-*.json
            apps/desktop/.desktop-build/installer-tests/run-*/*/results.json
            apps/desktop/.desktop-build/installer-tests/run-*/*/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Record artifact hashes
        shell: pwsh
        run: |
          $output = "apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts"
          $packs = "apps/desktop/.desktop-build/targets/${{ matrix.target }}/component-artifacts"
          Copy-Item "$packs/*.tar.gz" $output
          Copy-Item "$packs/components-*.json" $output
          $core = Get-ChildItem $output -File | Where-Object { $_.Extension -in '.exe', '.dmg', '.zip' }
          if ($core.Count -eq 0 -or ($core | Where-Object Length -gt 419430400)) { throw 'Core installers must exist and remain at most 400 MiB' }
          $files = Get-ChildItem $output -File | Where-Object { $_.Extension -in '.exe', '.dmg', '.zip', '.gz', '.json' }
          if ($files.Count -eq 0) { throw 'No installers were produced' }
          $lines = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          $lines | Set-Content -Encoding utf8NoBOM "$output/SHA256-${{ matrix.target }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: strugend-${{ matrix.target }}-${{ inputs.version }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.exe
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.dmg
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.zip
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.tar.gz
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/components-*.json
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/SHA256-*.txt

  release:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PREVIEW_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: strugend-*-${{ inputs.version }}
          path: preview
          merge-multiple: true
      - name: Publish BYOK test preview
        shell: bash
        run: |
          gh release create "strugend-v$PREVIEW_VERSION" preview/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "Strugend Harness $PREVIEW_VERSION · BYOK preview" \
            --notes-file apps/desktop/PREVIEW.md
