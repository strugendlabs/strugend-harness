name: Strugend Windows terminal diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exercise installer before terminal startup
        run: pnpm --dir apps/desktop run test:installer
      - name: Sample native startup without retrying failures
        shell: pwsh
        run: |
          $failed = $false
          foreach ($sample in 1..5) {
            Write-Output "Native terminal sample $sample"
            pnpm exec vitest run packages/terminal/terminal-bash/tests --maxWorkers=2 --testTimeout=90000 --hookTimeout=90000
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
